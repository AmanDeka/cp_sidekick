<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 220px;
      padding: 12px;
      margin: 0;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    button:disabled { background: #888; color: #fff; cursor: default; }
    #btn         { background: #0078d4; color: #fff; }
    #session-btn { background: #2ea043; color: #fff; }
    hr { border: none; border-top: 1px solid #ddd; margin: 6px 0; }
    #status {
      margin-top: 4px;
      font-size: 12px;
      color: #555;
      min-height: 16px;
    }
    #status.error { color: #c00; }
    #status.ok    { color: #060; }
  </style>
</head>
<body>
  <button id="btn">Open in VS Code</button>
  <hr>
  <button id="session-btn">Export CF Session</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
