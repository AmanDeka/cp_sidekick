<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 220px;
      padding: 12px;
      margin: 0;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #888;
      cursor: default;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
      min-height: 16px;
    }
    #status.error { color: #c00; }
    #status.ok    { color: #060; }
  </style>
</head>
<body>
  <button id="btn">Open in VS Code</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
